version: 2

project_name: steward

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    binary: steward

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

nfpms:
  - id: packages
    package_name: steward
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Steward
    homepage: https://github.com/k/steward
    maintainer: Steward Maintainer <steward@example.com>
    description: A CLI tool for orchestrating software features with AI coding agents
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

brews:
  - name: steward
    repository:
      owner: k
      name: homebrew-steward
    directory: Formula
    homepage: https://github.com/k/steward
    description: A CLI tool for orchestrating software features with AI coding agents
    license: MIT
    test: system "#{bin}/steward --help"
    install: bin.install "steward"

scoops:
  - name: steward
    repository:
      owner: k
      name: scoop-steward
    homepage: https://github.com/k/steward
    description: A CLI tool for orchestrating software features with AI coding agents
    license: MIT

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: k
    name: steward
  draft: false
  prerelease: auto
